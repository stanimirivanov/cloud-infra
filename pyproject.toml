[project]
name = "oci-oke-infrastructure"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["infra-core", "infra-program"]

[project.optional-dependencies]
inventory-oci = ["infra-core[inventory-oci]"]

[dependency-groups]
dev = [
    "ruff==0.14.2",
    "pytest>=8.4,<10",
    "mypy>=1.18,<2",
    "pre-commit==4.3.0",
    "PyYAML==6.0.3",
    "pip>=25,<27",
]

[tool.uv]
package = false
required-version = "==0.12.5"

[tool.uv.workspace]
members = ["packages/infra-core", "packages/infra-program", "sdks/supabase"]

[tool.uv.sources]
infra-core = { workspace = true }
infra-program = { workspace = true }
pulumi-supabase = { workspace = true }

[tool.ruff]
extend-exclude = ["sdks"] # Pinned generated SDK; checked through actual SDK serialization tests.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
markers = [
    "backend_integration: real local Pulumi backend/policy host (explicit opt-in; no cloud)",
    "provider_integration: real provider release assets (explicit opt-in; verification only)",
    "preview_integration: synthetic SDK subprocess/loopback RPC (explicit CI opt-in; no cloud)",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/infra-core/src", "packages/infra-program/src", ".github/scripts/collect-backend-posture.py", ".github/scripts/service-preview.py"]

# Generated provider SDK analysis is prohibitively large. Our interfaces remain strict;
# constructor arguments and wire schemas are checked using the actual SDK in mocks.
[[tool.mypy.overrides]]
module = [
    "pulumi_oci", "pulumi_oci.*",
    "pulumi_cloudflare", "pulumi_cloudflare.*",
    "pulumi_supabase", "pulumi_supabase.*",
]
follow_imports = "skip"
