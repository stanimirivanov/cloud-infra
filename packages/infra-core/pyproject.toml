[project]
name = "infra-core"
version = "0.1.0"
description = "Repository verification and infrastructure automation"
requires-python = ">=3.12,<3.13"
dependencies = ["python-hcl2==7.3.1"]

[project.scripts]
infra = "infra_core.cli:main"

[project.optional-dependencies]
inventory-oci = [
    "oci>=2.150,<3",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
