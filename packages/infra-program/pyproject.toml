[project]
name = "infra-program"
version = "0.1.0"
description = "Pulumi Python development foundation; provisioning is not enabled"
requires-python = ">=3.12,<3.13"
dependencies = [
    "infra-core",
    "pulumi>=3.200,<4",
    "pulumi-cloudflare==6.23.1",
    "pulumi-oci==5.5.0",
    "pulumi-policy>=1,<2",
    "pulumi-supabase==1.11.0",
]

[project.scripts]
infra = "infra_program.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
