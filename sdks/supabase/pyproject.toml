[project]
  name = "pulumi_supabase"
  description = "A Pulumi provider dynamically bridged from supabase."
  dependencies = ["packaging>=24.0", "pulumi>=3.247.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  readme = "README.md"
  requires-python = ">=3.9"
  version = "1.11.0"
  [project.urls]
    Repository = "https://github.com/supabase/terraform-provider-supabase"

[build-system]
  requires = ["hatchling==1.27.0"]
  build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulumi_supabase"]
