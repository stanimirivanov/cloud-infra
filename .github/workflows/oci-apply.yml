name: Protected OCI apply
on:
  workflow_dispatch:
    inputs:
      unit:
        description: Reviewed existing OCI unit; network before OKE
        type: choice
        required: true
        options: [oci-network, oci-oke]
      commit:
        description: Signed main commit, equal to this dispatch commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pulumi-operation-${{ github.repository }}-oci-dependency
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.sha == inputs.commit
    uses: ./.github/workflows/verify.yml
  apply:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.sha == inputs.commit
    runs-on:
      group: service-operations
      labels: [self-hosted, linux, x64]
    environment: ${{ inputs.unit }}-apply
    timeout-minutes: 20
    env:
      APPLY_UNIT: ${{ inputs.unit }}
      APPLY_COMMIT: ${{ inputs.commit }}
      APPLY_ENVIRONMENT: ${{ inputs.unit }}-apply
      APPLY_BUNDLE: ${{ vars.OCI_APPLY_BUNDLE }}
      APPLY_JOURNAL: ${{ vars.OCI_APPLY_JOURNAL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          clean: false # Durable ignored journal must not be removed by checkout clean.
      - run: python3 .github/scripts/install-tools.py
      - run: uv sync --locked --all-groups
      - name: Check signed inputs and fresh environment controls before cloud credentials
        env:
          GH_TOKEN: ${{ secrets.OPERATION_OBSERVATION_TOKEN }}
        run: >-
          uv run --locked infra apply --check --unit "$APPLY_UNIT" --commit "$APPLY_COMMIT"
          --actor "$GITHUB_ACTOR" --environment "$APPLY_ENVIRONMENT"
          --bundle "$APPLY_BUNDLE" --journal "$APPLY_JOURNAL"
      - name: Execute the approved single-unit plan
        env:
          GH_TOKEN: ${{ secrets.OPERATION_OBSERVATION_TOKEN }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_PATH: ${{ vars.OCI_PRIVATE_KEY_PATH }}
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: >-
          uv run --locked infra apply --allow-resource-writes --unit "$APPLY_UNIT" --commit "$APPLY_COMMIT"
          --actor "$GITHUB_ACTOR" --environment "$APPLY_ENVIRONMENT"
          --bundle "$APPLY_BUNDLE" --journal "$APPLY_JOURNAL"
