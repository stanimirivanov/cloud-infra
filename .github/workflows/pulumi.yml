name: Pulumi foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit is read-only; qualification writes synthetic state; deployment is disabled
        type: choice
        required: true
        options: [inspect, audit, qualify, preview, deploy]
        default: inspect
      unit:
        description: Reviewed deployment unit (preview/deploy remain readiness failures)
        type: choice
        options: [oci-network, oci-oke, cloudflare-edge, supabase-database]
        default: oci-network

permissions:
  contents: read

concurrency:
  group: pulumi-foundation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    uses: ./.github/workflows/verify.yml
  foundation:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pulumi-backend-qualification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified tools
        shell: bash
        run: python3 .github/scripts/install-tools.py
      - run: uv sync --locked --all-groups --extra inventory-oci
      - name: Collect and validate read-only backend posture
        id: audit
        if: inputs.operation == 'audit' || inputs.operation == 'qualify'
        env:
          OCI_BACKEND_AUDIT_CREDENTIALS: ${{ secrets.OCI_BACKEND_AUDIT_CREDENTIALS }}
          BACKEND_POSTURE_ACCOUNT_ID: ${{ vars.BACKEND_POSTURE_ACCOUNT_ID }}
        run: uv run --locked --extra inventory-oci python .github/scripts/collect-backend-posture.py
      - name: Inspect backend foundation
        if: inputs.operation == 'inspect'
        run: uv run --locked infra backend inspect
      - name: Qualify isolated OCI backend namespace
        if: inputs.operation == 'qualify'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          BACKEND_POSTURE_ACCOUNT_ID: ${{ vars.BACKEND_POSTURE_ACCOUNT_ID }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          uv run --locked infra backend qualify --account-id "$BACKEND_POSTURE_ACCOUNT_ID" --allow-backend-writes
      - name: Check resource operation readiness
        if: inputs.operation == 'preview' || inputs.operation == 'deploy'
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_UNIT: ${{ inputs.unit }}
        run: uv run --locked infra "$REQUESTED_OPERATION" --unit "$REQUESTED_UNIT"
      - name: Save sanitized qualification evidence
        if: success() && inputs.operation == 'qualify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-qualification
          path: .infra/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Remove private backend posture
        if: always()
        run: |
          uv run --locked python -c "from pathlib import Path; [Path(p).unlink(missing_ok=True) for p in ('.infra/backend-posture.json', '.infra/backend-posture.json.envelope.json')]"
      - name: Save sanitized backend audit
        if: always() && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-audit
          path: .infra/backend-audit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
