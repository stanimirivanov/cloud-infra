name: Pulumi foundation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Backend qualification writes synthetic state; resource operations remain disabled
        type: choice
        required: true
        options: [inspect, qualify, preview, deploy]
        default: inspect
      unit:
        description: Reviewed deployment unit (preview/deploy remain readiness failures)
        type: choice
        options: [oci-network, oci-oke, cloudflare-edge, supabase-database]
        default: oci-network

permissions:
  contents: read

concurrency:
  group: pulumi-foundation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    uses: ./.github/workflows/verify.yml
  foundation:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pulumi-backend-qualification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified tools
        shell: pwsh
        run: ./.github/scripts/install-tools.ps1
      - run: uv sync --locked --all-groups
      - name: Inspect backend foundation
        if: inputs.operation == 'inspect'
        run: uv run --locked infra backend inspect
      - name: Qualify isolated OCI backend namespace
        if: inputs.operation == 'qualify'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
          BACKEND_POSTURE_ENVELOPE_JSON: ${{ secrets.BACKEND_POSTURE_ENVELOPE_JSON }}
          BACKEND_POSTURE_ACCOUNT_ID: ${{ vars.BACKEND_POSTURE_ACCOUNT_ID }}
          BACKEND_POSTURE_JSON: ${{ secrets.BACKEND_POSTURE_JSON }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          uv run --locked python -c "import os; from pathlib import Path; p=Path('.infra/backend-posture.json'); p.parent.mkdir(exist_ok=True); p.write_bytes(os.environ['BACKEND_POSTURE_JSON'].encode('utf-8'))"
          uv run --locked python -c "import os; from pathlib import Path; Path('.infra/backend-posture.json.envelope.json').write_bytes(os.environ['BACKEND_POSTURE_ENVELOPE_JSON'].encode('utf-8'))"
          uv run --locked infra backend qualify --account-id "$BACKEND_POSTURE_ACCOUNT_ID" --allow-backend-writes
      - name: Check resource operation readiness
        if: inputs.operation == 'preview' || inputs.operation == 'deploy'
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          REQUESTED_UNIT: ${{ inputs.unit }}
        run: uv run --locked infra "$REQUESTED_OPERATION" --unit "$REQUESTED_UNIT"
      - name: Save sanitized qualification evidence
        if: success() && inputs.operation == 'qualify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-qualification
          path: .infra/qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
