name: Legacy Terraform (frozen)

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  frozen:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Terraform cloud writes and automatic recovery are frozen for the Pulumi migration."
