name: Harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Credential-free verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified tools
        shell: bash
        run: python3 .github/scripts/install-tools.py
      - run: uv sync --locked --all-groups
      - run: uv build --all-packages
      - name: Verify Python, Pulumi contracts and private artifacts
        run: uv run --locked infra verify
      - name: Qualify disposable local backend (no cloud credentials)
        env:
          RUN_PULUMI_LOCAL_QUALIFICATION: '1'
        run: |
          uv run --locked python -c "from pathlib import Path; Path('.infra').mkdir(exist_ok=True)"
          uv run --locked pytest -q -m backend_integration --basetemp .infra/pytest-backend -o cache_dir=.infra/pytest-cache
      - name: Verify synthetic SDK process and raw event transport (no cloud)
        env:
          RUN_SYNTHETIC_PREVIEW_INTEGRATION: '1'
        run: uv run --locked pytest -q -m preview_integration --basetemp .infra/pytest-preview -o cache_dir=.infra/pytest-cache
      - name: Verify native provider release assets (no credentials or execution)
        shell: bash
        env:
          RUN_PROVIDER_INTEGRATION: '1'
        run: |
          python3 .github/scripts/install-providers.py
          uv run --locked pytest tests/test_provider_tools.py -q -m provider_integration --basetemp .infra/pytest-providers -o cache_dir=.infra/pytest-cache
      - name: Verify Supabase cache and offline schema (no credentials)
        shell: bash
        env:
          RUN_PROVIDER_INTEGRATION: '1'
        run: |
          python3 .github/scripts/install-providers.py --provider supabase
          uv run --locked pytest tests/test_supabase_provider_cache.py -q -m provider_integration --basetemp .infra/pytest-supabase-provider -o cache_dir=.infra/pytest-cache
