name: Harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Credential-free verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.5'
          enable-cache: false
      - run: uv sync --locked --all-groups
      - run: uv build --all-packages
      - uses: hashicorp/setup-terraform@v4
        if: runner.os == 'Linux'
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - uses: autero1/action-terragrunt@v3
        if: runner.os == 'Linux'
        with:
          terragrunt-version: '0.97.2'
      - name: Verify Python and infrastructure
        if: runner.os == 'Linux'
        run: uv run --locked infra verify
      - name: Verify Python packaging and harness
        if: runner.os == 'Windows'
        run: uv run --locked infra verify --scope python
      - uses: pulumi/actions@v7
        with:
          pulumi-version: '3.272.0'
      - name: Qualify disposable local backend (no cloud credentials)
        env:
          RUN_PULUMI_LOCAL_QUALIFICATION: '1'
        run: uv run --locked pytest -q -m backend_integration --basetemp .infra/pytest-backend -o cache_dir=.infra/pytest-cache
